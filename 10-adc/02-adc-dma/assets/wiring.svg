<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#fbfbf7"/>
  <rect x="1" y="1" width="898" height="398" fill="none" stroke="#333" stroke-width="1"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Koneksi Potensiometer ke ADC1 (PC0 / Channel 10)</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#555">Ujung potensiometer ke +3,3 V dan GND; kaki tengah (wiper) ke PC0 sebagai masukan analog.</text>

  <!-- +3V3 rail -->
  <text x="150" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#b02020">+3V3</text>
  <line x1="150" y1="130" x2="150" y2="180" stroke="#b02020" stroke-width="2.4"/>

  <!-- potentiometer body -->
  <rect x="130" y="180" width="40" height="120" fill="#e9e9e9" stroke="#333" stroke-width="1.6"/>
  <line x1="150" y1="180" x2="150" y2="300" stroke="#333" stroke-width="1.2"/>
  <!-- wiper arrow -->
  <line x1="250" y1="240" x2="175" y2="240" stroke="#222" stroke-width="2.2"/>
  <polygon points="175,240 185,235 185,245" fill="#222"/>

  <!-- GND -->
  <line x1="150" y1="300" x2="150" y2="330" stroke="#333" stroke-width="2.4"/>
  <line x1="128" y1="330" x2="172" y2="330" stroke="#333" stroke-width="2.5"/>
  <line x1="136" y1="338" x2="164" y2="338" stroke="#333" stroke-width="2.5"/>
  <line x1="144" y1="346" x2="156" y2="346" stroke="#333" stroke-width="2.5"/>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#222">GND</text>

  <!-- to MCU PC0 -->
  <line x1="250" y1="240" x2="470" y2="240" stroke="#222" stroke-width="2.4"/>
  <rect x="470" y="200" width="240" height="200" rx="8" fill="#eef4fb" stroke="#2f6fb3" stroke-width="1.6"/>
  <text x="590" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#1f4e79">STM32F407VGT6</text>
  <rect x="440" y="227" width="50" height="26" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="465" y="245" text-anchor="middle" font-size="11" font-family="Consolas, monospace">PC0</text>
  <text x="590" y="290" text-anchor="middle" font-size="11" fill="#1f4e79">ADC1 Channel 10</text>
  <text x="590" y="310" text-anchor="middle" font-size="11" fill="#1f4e79">mode analog</text>
</svg>
