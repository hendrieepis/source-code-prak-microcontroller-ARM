[platformio]
default_envs = disco_f407vg

; PlatformIO Project Configuration File
;
; Modul 02 - Direct IO: tombol USER (PA0) mengendalikan LED LD4 (PD12).
; Board : ST STM32F4DISCOVERY (disco_f407vg)

[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = stm32cube

; ---------------------------------------------------------------------------
; Uji/debug firmware di Renode (TANPA hardware).
; Environment ini TIDAK dipakai secara default; default tetap [env:disco_f407vg]
; untuk board asli (lihat default_envs pada bagian [platformio]).
;
;   Uji cepat (CLI)       : renode -e "i @renode/blinky.resc"
;   Amati di GUI          : renode -e "i @renode/blinky_gui.resc"
;   Debug GDB dari CLI    : pio debug -e renode_debug --interface=gdb
;   Debug GDB dari VS Code: pilih environment "renode_debug", lalu F5
; ---------------------------------------------------------------------------
[env:renode_debug]
extends = env:disco_f407vg
debug_tool = custom
debug_port = localhost:3333
debug_init_break = tbreak main
debug_server_ready_pattern = GDB server with all CPUs started
debug_server =
  C:\Program Files\Renode\renode.exe
  --disable-gui
  -P
  4567
  -e
  i @renode/gdb_noload.resc
debug_init_cmds =
  target extended-remote $DEBUG_PORT
  $LOAD_CMDS
  $INIT_BREAK
