<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#fbfbf7"/>
  <rect x="1" y="1" width="898" height="418" fill="none" stroke="#333" stroke-width="1"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#111">SPI1 Master dengan Loopback PA7 (MOSI) - PA6 (MISO)</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#555">Jumperkan MOSI ke MISO; SCK (PA5) tetap sebagai clock. UART untuk menampilkan hasil.</text>

  <!-- MCU -->
  <rect x="120" y="100" width="260" height="280" rx="8" fill="#eef4fb" stroke="#2f6fb3" stroke-width="1.6"/>
  <text x="250" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1f4e79">STM32F407VGT6</text>

  <rect x="380" y="156" width="60" height="24" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="410" y="173" text-anchor="middle" font-size="11" font-family="Consolas, monospace">PA5</text>
  <text x="250" y="173" text-anchor="middle" font-size="11" fill="#1f4e79">SCK</text>

  <rect x="380" y="216" width="60" height="24" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="410" y="233" text-anchor="middle" font-size="11" font-family="Consolas, monospace">PA6</text>
  <text x="250" y="233" text-anchor="middle" font-size="11" fill="#1f4e79">MISO</text>

  <rect x="380" y="276" width="60" height="24" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="410" y="293" text-anchor="middle" font-size="11" font-family="Consolas, monospace">PA7</text>
  <text x="250" y="293" text-anchor="middle" font-size="11" fill="#1f4e79">MOSI</text>

  <rect x="380" y="336" width="60" height="24" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="410" y="353" text-anchor="middle" font-size="11" font-family="Consolas, monospace">PA2</text>
  <text x="250" y="353" text-anchor="middle" font-size="11" fill="#1f4e79">USART2 TX</text>

  <!-- loopback jumper -->
  <path d="M440 228 C 560 228, 560 288, 440 288" fill="none" stroke="#c0392b" stroke-width="2.6"/>
  <text x="560" y="258" text-anchor="middle" font-size="12" fill="#c0392b">jumper loopback</text>

  <!-- UART adapter -->
  <line x1="440" y1="348" x2="660" y2="348" stroke="#222" stroke-width="2.4"/>
  <rect x="660" y="308" width="180" height="80" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.6"/>
  <text x="750" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#333">USB-Serial</text>
  <text x="750" y="360" text-anchor="middle" font-size="11" fill="#555">RX (9600 baud)</text>
</svg>
